version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vvg
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
  api:
    build: ./apps/api
    depends_on:
      - db
      - redis
      - minio
    environment:
      PORT: 3001
      DATABASE_URL: postgres://user:password@db:5432/vvg
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: viral-videos
      BASE_URL_API: http://api:3001
      BASE_URL_WEB: http://web:3000
    ports:
      - '3001:3001'
  web:
    build: ./apps/web
    environment:
      BASE_URL_API: http://api:3001
    ports:
      - '3000:3000'
  worker:
    build: ./apps/worker
    depends_on:
      - redis
      - db
